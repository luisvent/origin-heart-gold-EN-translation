notes = "Pryce's rule check, script file 928 L269-L800 (bytes 0x10C-0x321: from the last byte of the GoToIf before it to the TrainerBattle command after it, kept even): the 28 PlayerHasSpecies checks become the Ability loop; the asm guards each old check."
