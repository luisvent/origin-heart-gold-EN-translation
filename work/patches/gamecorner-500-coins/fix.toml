id = "gamecorner-500-coins"
title = "Game Corner: the raised-price '500 coins for $50000' option gives 500 coins, not 50"
kind = "narc"
enabled = true
decisions = ["D-1415", "D-2365"]
requires = []
why = """Goldenrod Game Corner clerk (script file 903, text bank 0591). After the magnet cheater scene the clerk's menu is raised (#94 '50 coins for $5000', #95 '500 coins for $50000'). The $5000 option (L7501) checks and gives 50 coins; the $50000 option (L7575) checks $50000 and takes it (SubMoneyImmediate 50000 at 7617) but its CheckGiveCoins (7596) and GiveCoins (7623) both use 50. The player pays ten times the price for a tenth of the coins. The normal menu (L3657/L3731) gives 50 for $500 and 500 for $5000, so 500 is the intended count. Observed in the emulator on the Chinese ROM and rc7 (D-1415)."""
what = """Two operands: the coin count in the CheckGiveCoins at 7596 and in the GiveCoins at 7623, 50 -> 500. The money check and charge (50000) are untouched. No other byte changes."""
evidence = [
  "work/notes/gamecorner_500_coins_fix.md",
  "work/notes/gamecorner_500_coins_investigation.md",
  "work/tools/test_gamecorner_500_coins.py",
]

