member = 225
offset = "0xf91"
expect = "0x07D9"
new = "0x0000"
member_sha1 = "b52e7570aa0bbea98a239e29c8d6d5b0717ed90e"
notes = "Route 29 sibling: command 2009 after PlayFanfare 20 at 3981 -> Noop; CloseMsg/ReleaseAll/End follow at 3987."

