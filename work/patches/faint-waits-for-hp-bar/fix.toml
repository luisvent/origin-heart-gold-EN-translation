file = "overlay14"
offset = "0x4942"
expect = "0000 B508 6811 0609 0E09 F027 FD26 2800 D001 2001 BD08 2000 BD08"
notes = "Command 21's handler (old: 0x02205124), moved 2 bytes earlier into the alignment padding: returns 0 while HpBarDone (0x02252D3E) is 0, i.e. while an HP bar is draining, else Faint_Run(client, battler) as before. The asm also guards, read-only, the task start and end that write the byte."

