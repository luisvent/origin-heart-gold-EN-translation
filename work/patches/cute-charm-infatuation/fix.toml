file = "overlay14"
offset = "0x322EE"
expect = "2107 1C2A F7F2 FD25"
notes = "Cute Charm handler: the infatuation's continuation is built with SickCont_MakeLinked(holder, holder) (0x022251D0, kind 3) instead of the status-condition constructor 0x02225520 with condition 7 (kind 0, an empty entry). The asm also guards, read-only, the rest of the handler."
