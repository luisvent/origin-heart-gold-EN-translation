id = "overworld-pokemon-cries"
title = "Stationary overworld Pokemon cry as the species their label and sprite show"
kind = "narc"
enabled = false
decisions = ["D-2398", "D-2399", "D-2400"]
requires = []
why = """
The cry of 29 stationary overworld Pokemon is another species than the one their Chinese speaker label names and their sprite draws
(Route 6 Cloyster cries Magmortar, Route 43 Sentrets cry Smoochum, Cerulean Gym Seels cry Goldeen; Herdier plays 791 and Palpitoad 820,
exactly 284 above their real ids 507 and 536). User decision 2026-10-12 (D-2398): where label and sprite agree, the cry follows them;
text is never changed by this fix. Not touched: Kirk's Sylveon, the S.S. Aqua Bulbasaur, Viridian Doduo, Pokeathlon Pidgey, the
Route 21 Lairon (cry plays Onix, D-2400) and the silent objects (open questions, D-2399). RECHECK WHEN 4.1.0 RELEASES: every object in
work/notes/overworld-pokemon-sprite-mismatch_fix.md must be looked at again in the game (4.1.0 may change sprites or cries).

Status: disabled. Merged into develop on 2026-10-12 as a separate, switched-off patch at the user's request: the standard
build keeps the Chinese behaviour and builds this only on request (build.py --only overworld-pokemon-cries). The byte guards
(member SHA-1 and expected value of every entry) were re-checked against the Chinese ROM at merge. Notes:
work/notes/overworld-pokemon-sprite-mismatch_fix.md.
"""
what = """
Replace the species argument of 23 PlayCry commands (first halfword of the command's two arguments, form 0 kept) in a/0/1/2 with the
national dex id of the drawn and labelled species; they serve 29 object events (Slowpoke Well Slowbros, Cerulean Gym Seels, Route 43
Sentrets, Red's house Butterfrees and Sinjoh Shiftry share scripts). Nothing else in those scripts changes; no text changes.
"""
evidence = ["work/notes/overworld-pokemon-sprite-mismatch_fix.md", "work/tools/test_overworld_pokemon_cries.py"]

