id = "overworld-pokemon-sprites"
title = "Draw stationary overworld Pokemon as the species their Chinese text and cry name"
kind = "narc"
enabled = true
decisions = ["D-2346", "D-2347", "D-2349"]
requires = []
why = """
Overworld Pokemon objects (the Jigglypuff in the Pewter Pokemon Center, the Machoke in the Goldenrod Department Store basement, the
Ampharos in the Olivine Lighthouse, the Pokeathlon Dome participants, ...) keep the sprite ids of the vanilla game: ids 994..1046 are
vanilla's NPC-Pokemon sprites in dex order (Butterfree 994 ... Jigglypuff 1004 ... Machoke 1014 ... Ampharos 1031 ... Kyogre 1043; read
from the USA ROM's own objects and scripts). The hack's overworld sprite table (data/pokemon_overworld_info.narc + arm9 0x0206900C) uses
ids 428..1894 for the following Pokemon, sprite id = 428 + the table's base offset of the species (Bulbasaur 428, Jigglypuff 468), so
the vanilla ids now draw Generation 5 species (994 = Victini, 1004 = Patrat, 1014 = Simisear, 1031 = Audino, 1043 = Venipede). The
Chinese ROM draws the same wrong sprites: the Pokemon beside the man who talks about Jigglypuff says and cries Jigglypuff but is a
Patrat. Rule (user decision 2026-10-12, D-2349): the sprites follow the Chinese text and cry; text and cry are not changed.
RECHECK WHEN 4.1.0 RELEASES: every object in work/notes/overworld-pokemon-sprite-mismatch_fix.md (section "Recheck when 4.1.0
releases") must be looked at again in the game, because 4.1.0 may change the sprites.
"""
what = """
Replace the sprite id of 37 object events with the following-Pokemon sprite id of the species the object's Chinese text and cry name
(428 + base offset from the table): the vanilla NPC-Pokemon ids 994..1046 whose speaker label and cry agree (Jigglypuff, Machoke,
Ampharos, Pikachu, Slowbro, the Pokeathlon and Safari warden Pokemon, Kyogre, Abra, ...), the second Indigo Plateau Metagross
(Tyranitar 709, same script as the Metagross objects drawn 837), Kirk's Sylveon (Leafeon 946; its cry disagrees with its label: label
wins, needs user check) and the S.S. Aqua Bulbasaur (Ivysaur 429; label and sound say Bulbasaur, cry says Ivysaur: needs user check).
Only the 2-byte sprite id changes; position, flag, script, movement and facing stay. Silent objects (Mount Moon Clefairy, Moomoo
Farm Miltank, Pokeathlon Poliwrath) and the Route 21 Lairon are not changed. Text and cries are not touched.
"""
evidence = [
  "work/notes/overworld-pokemon-sprite-mismatch_fix.md",
  "work/tools/test_overworld_pokemon_sprites.py",
]

