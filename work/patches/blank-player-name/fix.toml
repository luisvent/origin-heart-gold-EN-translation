offset = "0x1ce"
expect = "2D00 1A00 0032 0035 005E 00FF 070E 0000 005F 00BE 2D00"
new = "BE00 0000 002D 321A 3500 5E00 FF00 0B00 0007 5F00 2D00"
member_sha1 = "43275c7fcd428781cbdc5c7f93e19e10c4824114"
notes = "Rotation: BufferPlayersName [0] at 480 moves in front of NPCMsg at 463; the 17 bytes between shift up by 3 and the relative operand of the ApplyMovement among them is lowered by 3 (same absolute target); same size, no jump target inside."


