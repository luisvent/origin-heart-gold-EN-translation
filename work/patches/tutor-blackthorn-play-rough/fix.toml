narc = "a/0/1/2"
member = 944
offset = "0x789"
expect = "0x00AF"
new = "0x0247"
member_sha1 = "9c0d1c894a8cbdf3a6ae892445e45fb34a16c0d5"
notes = "MonHasMove 0x800C, 175 -> 583 at pc 1925 (operand at +4): the 'This X already knows Play Rough' check."

