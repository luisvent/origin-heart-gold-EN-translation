id = "petilil"
description = "D-1485 / D-2334: Petilil holding a Black Belt, Rare Candy at 12:00. The Chinese hack makes a form-1 Petilil (548); the standard English build, with petilil-hisuian-lilligant disabled, does the same"
refs = ["D-1485", "D-2334"]
# Generator Petilil Lv10 with a Black Belt (241) in party slot 6, Rare Candy through Bag -> Medicine -> Use (the game's
# own level-up and evolution path). petilil-hisuian-lilligant is disabled (D-2334): the standard build must match the
# Chinese ROM (Petilil, form 1). The fixed outcome (549) is judged by the fix scenario petilil-evo (emu_fixes.py).
steps = [
  "gen:548,10,241",
  "candy:@gen",
  { observe = "after_candy", party = "@gen", fields = ["species", "form", "item", "level"] },
  "s:after_candy",
  "summary:@gen",
  "s:summary",
]

[start]
save = "full_bag_6mons.sav"
clock = "2026-10-09T12:00:00"
pockets = { medicine = [[50, 99]], items = [] }

[[case]]
id = "petilil_day"
description = "Black Belt by day: form-1 Petilil on the hack and on the standard build (the fix is disabled)"
expect = [
  { obs = "after_candy.form", equals = 1 },
  { obs = "after_candy.level", equals = 11 },
]
